<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>NextShopBD Courier Scanner</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 15px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    h2 {
      text-align: center;
    }

    .card {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }

    #reader {
      width: 100%;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #16803c;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    #stopBtn {
      background: #c62828;
    }

    #status {
      text-align: center;
      margin-top: 12px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📦 NextShopBD<br>Courier Scan Panel</h2>

  <div class="card">

    <div id="reader"></div>

    <button id="startBtn" onclick="startCamera()">
      📷 START CAMERA
    </button>

    <button id="stopBtn" onclick="stopCamera()">
      ⛔ STOP CAMERA
    </button>

    <div id="status">
      Camera বন্ধ আছে
    </div>

  </div>


  <div class="card">

    <label>Courier</label>

    <select id="courier">
      <option value="">Auto Detect</option>
      <option value="Pathao">Pathao</option>
      <option value="Steadfast">Steadfast</option>
    </select>


    <label>Order ID</label>
    <input id="orderId" type="text">


    <label>Customer Phone</label>
    <input id="phone" type="text">


    <label>Product Name</label>
    <input id="product" type="text">


    <label>Qty</label>
    <input id="qty" type="number">


    <label>COD / Price</label>
    <input id="cod" type="number">


    <button onclick="showSavedMessage()">
      SAVE PARCEL
    </button>

  </div>

</div>


<script>

let scanner = null;
let scannedText = "";
let cameraRunning = false;


/* =========================
   START CAMERA
========================= */

async function startCamera() {

  const status =
    document.getElementById("status");

  status.innerText =
    "📷 Camera চালু হচ্ছে...";


  try {

    scanner =
      new Html5Qrcode("reader");


    const cameras =
      await Html5Qrcode.getCameras();


    if (!cameras || cameras.length === 0) {
      throw new Error("Camera পাওয়া যায়নি");
    }


    let selectedCamera = cameras.find(function(camera) {
  return /back|rear|environment/i.test(camera.label);
});

const cameraId =
  selectedCamera ? selectedCamera.id : cameras[0].id;

    await scanner.start(
  cameraId,
  {
    fps: 15,
    qrbox: {
      width: 250,
      height: 250
    },
    aspectRatio: 1.0,
    disableFlip: false,
    formatsToSupport: [
      Html5QrcodeSupportedFormats.QR_CODE,
      Html5QrcodeSupportedFormats.CODE_128
    ]
  },
  onScanSuccess,
  function (errorMessage) {
    // Scan না হলে কিছু করার দরকার নেই
  }
);

    cameraRunning = true;

    status.innerText =
      "📷 Camera চালু হয়েছে — QR code দেখান";

  }

  catch (error) {

    console.error(error);

    status.innerText =
      "❌ Camera চালু হয়নি: " +
      error.message;

  }

}


/* =========================
   STOP CAMERA
========================= */

async function stopCamera() {

  if (scanner && cameraRunning) {

    try {
      await scanner.stop();
      await scanner.clear();
    }

    catch (error) {
      console.log(error);
    }

  }

  scanner = null;
  cameraRunning = false;

  document.getElementById("status").innerText =
    "Camera বন্ধ আছে";

}


/* =========================
   QR SUCCESS
========================= */

function onScanSuccess(decodedText) {

  if (!decodedText) {
    return;
  }

  scannedText =
    decodedText;

  parseCourierData(decodedText);

  stopCamera();

}


/* =========================
   PARSE DATA
========================= */

function parseCourierData(text) {

  let courier = "";


  if (/steadfast/i.test(text)) {
    courier = "Steadfast";
  }

  if (/pathao/i.test(text)) {
    courier = "Pathao";
  }


  document.getElementById("courier").value =
    courier;


  let match;


  /* Order ID */

  let orderId = "";

  match =
    text.match(
      /Order\s*ID\s*[:#-]?\s*([A-Za-z0-9-]+)/i
    );

  if (match) {
    orderId = match[1];
  }


  /* Pathao DN */

  if (!orderId) {

    match =
      text.match(
        /\bDN[A-Za-z0-9-]+\b/i
      );

    if (match) {
      orderId = match[0];
    }

  }


  /* Steadfast Invoice */

  if (!orderId) {

    match =
      text.match(
        /Invoice\s*ID\s*[:#-]?\s*([0-9]+)/i
      );

    if (match) {
      orderId = match[1];
    }

  }


  document.getElementById("orderId").value =
    orderId;


  /* Phone */

  const phones =
    text.match(
      /\b01[3-9][0-9]{8}\b/g
    );

  if (phones && phones.length) {

    document.getElementById("phone").value =
      phones[0];

  }


  /* COD */

  match =
    text.match(
      /(?:COD|CASH\s+ON\s+DELIVERY)\s*[:\-]?\s*(?:BDT|Tk)?\s*([0-9,]+(?:\.[0-9]+)?)/i
    );

  if (match) {

    document.getElementById("cod").value =
      match[1].replace(/,/g, "");

  }


  /* Product + Qty */

  match =
    text.match(
      /\b([0-9]+)\s*x\s+([^\n\r]+)/i
    );

  if (match) {

    document.getElementById("qty").value =
      match[1];

    document.getElementById("product").value =
      match[2].trim();

  }


  document.getElementById("status").innerText =
    "✅ Scan successful — তথ্যগুলো দেখে SAVE PARCEL চাপুন";

}


/* =========================
   TEMP SAVE BUTTON
========================= */

function showSavedMessage() {

  document.getElementById("status").innerText =
    "✅ তথ্য প্রস্তুত আছে";

}

</script>

</body>
</html>
