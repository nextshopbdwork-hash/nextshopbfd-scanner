<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>NextShopBD Courier Scanner</title>


  <!-- QR / BARCODE SCANNER -->
  <script src="https://unpkg.com/html5-qrcode"></script>


  <!-- OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>


  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 15px;
    }


    .container {
      max-width: 500px;
      margin: auto;
    }


    h2 {
      text-align: center;
      margin-bottom: 15px;
    }


    .card {
      background: white;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }


    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
    }


    #ocrCanvas {
      display: none;
    }


    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }


    input,
    select,
    button,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }


    button {
      background: #16803c;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }


    #stopBtn {
      background: #c62828;
    }


    #ocrBtn {
      background: #1565c0;
    }


    #status {
      text-align: center;
      margin-top: 12px;
      font-weight: bold;
      line-height: 1.5;
    }


    #ocrText {
      min-height: 130px;
      resize: vertical;
      background: #fafafa;
    }

  </style>

</head>


<body>


<div class="container">


  <h2>
    📦 NextShopBD<br>
    Courier Scan Panel
  </h2>


  <!-- =========================
       CAMERA
  ========================== -->

  <div class="card">

    <div id="reader"></div>

    <canvas id="ocrCanvas"></canvas>


    <button
      id="startBtn"
      onclick="startCamera()"
    >
      📷 START CAMERA
    </button>


    <button
      id="stopBtn"
      onclick="stopCamera()"
    >
      ⛔ STOP CAMERA
    </button>


    <button
      id="ocrBtn"
      onclick="runOCR()"
    >
      📝 OCR CURRENT LABEL
    </button>


    <div id="status">
      Camera বন্ধ আছে
    </div>

  </div>



  <!-- =========================
       FORM
  ========================== -->

  <div class="card">


    <label>Courier</label>

    <select id="courier">

      <option value="">
        Auto Detect
      </option>

      <option value="Pathao">
        Pathao
      </option>

      <option value="Steadfast">
        Steadfast
      </option>

    </select>



    <label>Order ID</label>

    <input
      id="orderId"
      type="text"
      autocomplete="off"
    >



    <label>DN / Tracking ID</label>

    <input
      id="dn"
      type="text"
      autocomplete="off"
    >



    <label>Customer Phone</label>

    <input
      id="phone"
      type="text"
      autocomplete="off"
    >



    <label>Product Name</label>

    <input
      id="product"
      type="text"
      autocomplete="off"
    >



    <label>Qty</label>

    <input
      id="qty"
      type="number"
      min="1"
    >



    <label>COD / Price</label>

    <input
      id="cod"
      type="number"
      min="0"
      step="0.01"
    >



    <label>OCR Result</label>

    <textarea
      id="ocrText"
      readonly
      placeholder="OCR text এখানে দেখা যাবে"
    ></textarea>



    <button
      onclick="showSavedMessage()"
    >
      💾 SAVE PARCEL
    </button>

  </div>


</div>



<script>


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let scanner = null;

let scannedText = "";

let cameraRunning = false;

let lastFrameCanvas = null;


/*
  QR থেকে পাওয়া তথ্যকে priority দেওয়া হবে।
  OCR পরে এসে ভুল তথ্য দিয়ে overwrite করবে না।
*/
let qrDataLocked = false;



/* =====================================================
   HELPERS
===================================================== */


/*
  Element-এর value খালি কিনা
*/
function isEmpty(id) {

  const element =
    document.getElementById(id);

  return !element ||
         !String(element.value || "").trim();

}


/*
  শুধু field খালি থাকলে value বসাবে
*/
function setIfEmpty(id, value) {

  if (!value) {
    return;
  }

  const element =
    document.getElementById(id);

  if (!element) {
    return;
  }

  if (!String(element.value || "").trim()) {

    element.value =
      String(value).trim();

  }

}


/*
  value বসাবে
*/
function setValue(id, value) {

  if (!value) {
    return;
  }

  const element =
    document.getElementById(id);

  if (element) {

    element.value =
      String(value).trim();

  }

}


/*
  Phone clean
*/
function cleanPhone(value) {

  let phone =
    String(value || "")
      .replace(/[^0-9]/g, "");


  if (phone.startsWith("880")) {

    phone =
      phone.substring(2);

  }


  return phone;

}


/*
  Number clean
*/
function cleanNumber(value) {

  return String(value || "")
    .replace(/,/g, "")
    .replace(/[^\d.]/g, "");

}



/* =====================================================
   START CAMERA
===================================================== */

async function startCamera() {


  const status =
    document.getElementById("status");


  status.innerText =
    "📷 Camera চালু হচ্ছে...";


  try {


    /*
      আগের scanner থাকলে বন্ধ
    */

    if (scanner) {

      try {

        await stopCamera();

      } catch (e) {

        console.log(e);

      }

    }


    scanner =
      new Html5Qrcode("reader");


    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "Camera পাওয়া যায়নি"
      );

    }


    /*
      Back / Rear camera আগে খুঁজবে
    */

    let selectedCamera =
      cameras.find(function(camera) {

        return /back|rear|environment/i
          .test(camera.label || "");

      });


    const cameraId =
      selectedCamera
        ? selectedCamera.id
        : cameras[0].id;



    await scanner.start(

      cameraId,

      {

        fps: 15,

        qrbox: {
          width: 250,
          height: 250
        },

        aspectRatio: 1.0,

        disableFlip: false,

        formatsToSupport: [

          Html5QrcodeSupportedFormats.QR_CODE,

          Html5QrcodeSupportedFormats.CODE_128,

          Html5QrcodeSupportedFormats.CODE_39,

          Html5QrcodeSupportedFormats.EAN_13,

          Html5QrcodeSupportedFormats.EAN_8

        ]

      },


      onScanSuccess,


      function(errorMessage) {

        /*
          Scan না হলে
          কিছু করার দরকার নেই
        */

      }

    );


    cameraRunning = true;

    lastFrameCanvas = null;


    status.innerText =
      "📷 Camera চালু হয়েছে — QR / Barcode দেখান";

  }


  catch(error) {


    console.error(error);


    scanner = null;

    cameraRunning = false;


    status.innerText =
      "❌ Camera চালু হয়নি: " +
      error.message;

  }

}



/* =====================================================
   STOP CAMERA
===================================================== */

async function stopCamera() {


  if (
    scanner &&
    cameraRunning
  ) {


    try {

      await scanner.stop();

      await scanner.clear();

    }


    catch(error) {

      console.log(error);

    }

  }


  scanner = null;

  cameraRunning = false;


  document.getElementById(
    "status"
  ).innerText =
    "Camera বন্ধ আছে";

}



/* =====================================================
   CAPTURE CAMERA FRAME
===================================================== */

function captureCameraFrame() {


  const video =
    document.querySelector(
      "#reader video"
    );


  if (!video) {

    return null;

  }


  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    return null;

  }


  const canvas =
    document.getElementById(
      "ocrCanvas"
    );


  canvas.width =
    video.videoWidth;


  canvas.height =
    video.videoHeight;


  const ctx =
    canvas.getContext("2d");


  /*
    Mirror নয়,
    normal camera frame
  */

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );


  return canvas;

}



/* =====================================================
   QR SUCCESS
===================================================== */

async function onScanSuccess(
  decodedText
) {


  if (!decodedText) {

    return;

  }


  /*
    একই QR বারবার পড়বে না
  */

  if (
    scannedText === decodedText
  ) {

    return;

  }


  scannedText =
    decodedText;


  /*
    QR data priority lock
  */

  qrDataLocked = true;


  /*
    QR data parse
  */

  parseCourierData(
    decodedText,
    true
  );


  /*
    Camera frame capture
    OCR করার আগে
  */

  const canvas =
    captureCameraFrame();


  if (canvas) {

    lastFrameCanvas =
      canvas;

  }


  /*
    Camera বন্ধ
  */

  await stopCamera();


  /*
    OCR automatically শুরু
  */

  if (lastFrameCanvas) {

    await runOCR();

  }

}



/* =====================================================
   OCR
===================================================== */

async function runOCR() {


  let canvas =
    lastFrameCanvas;


  /*
    Camera চালু থাকলে
    current frame নেওয়া হবে
  */

  if (!canvas) {

    canvas =
      captureCameraFrame();

  }


  if (!canvas) {

    document.getElementById(
      "status"
    ).innerText =
      "❌ Camera frame পাওয়া যায়নি";

    return;

  }


  const status =
    document.getElementById(
      "status"
    );


  status.innerText =
    "📝 OCR শুরু হচ্ছে...";


  try {


    const result =
      await Tesseract.recognize(

        canvas,

        "eng",

        {

          logger: function(info) {


            if (
              info.status ===
              "recognizing text"
            ) {


              const percent =
                Math.round(
                  (info.progress || 0) * 100
                );


              status.innerText =
                "📝 OCR চলছে... " +
                percent +
                "%";

            }

          }

        }

      );


    const text =
      result.data.text || "";


    /*
      OCR result দেখানো
    */

    document.getElementById(
      "ocrText"
    ).value =
      text;


    /*
      OCR data parse
      QR-এর data overwrite করবে না
    */

    parseCourierData(
      text,
      false
    );


    status.innerText =
      "✅ QR + OCR complete — তথ্যগুলো দেখে SAVE PARCEL চাপুন";

  }


  catch(error) {


    console.error(error);


    status.innerText =
      "❌ OCR করা যায়নি";

  }

}



/* =====================================================
   PARSE COURIER DATA
===================================================== */

function parseCourierData(
  text,
  fromQR = false
) {


  text =
    String(text || "")
      .replace(/\r/g, "\n")
      .replace(/[ \t]+/g, " ")
      .trim();


  if (!text) {

    return;

  }


  /*
    OCR-এর ক্ষেত্রে কিছু common
    character correction
  */

  const normalized =
    text
      .replace(/[“”]/g, '"')
      .replace(/[‘’]/g, "'");



  /* ===================================================
     COURIER DETECTION
  =================================================== */

  let courier = "";


  if (
    /steadfast/i.test(normalized)
  ) {

    courier =
      "Steadfast";

  }


  if (
    /pathao/i.test(normalized)
  ) {

    courier =
      "Pathao";

  }


  /*
    DN থাকলে অনেক সময় Pathao বোঝা যায়
    কিন্তু Steadfast হলে courier আগে থেকে থাকতে পারে।
  */

  if (
    !courier &&
    /\bDN[\s:#-]*[A-Z0-9-]{4,20}\b/i.test(normalized)
  ) {

    /*
      শুধু DN দেখে Pathao force করছি না,
      কারণ অন্য courier-এও DN থাকতে পারে।
    */

  }


  if (courier) {

    if (
      fromQR ||
      isEmpty("courier")
    ) {

      setValue(
        "courier",
        courier
      );

    }

  }



  /* ===================================================
     ORDER ID
  =================================================== */

  let orderId = "";

  let match;


  /*
    1.
    Order ID: 281650630
    Order No: 231850830
  */

  match =
    normalized.match(
      /\bOrder\s*(?:ID|No|Number)?\s*[:#\-]?\s*([A-Za-z0-9][A-Za-z0-9-]{4,20})/i
    );


  if (match) {

    orderId =
      match[1];

  }



  /*
    2.
    Invoice ID / Invoice
  */

  if (!orderId) {

    match =
      normalized.match(
        /\bInvoice\s*(?:ID|No|Number)?\s*[:#\-]?\s*([0-9]{5,20})/i
      );


    if (match) {

      orderId =
        match[1];

    }

  }



  /*
    3.
    Invoice label-এর পরে number
    Steadfast-এর জন্য
  */

  if (!orderId) {

    match =
      normalized.match(
        /\bInvoice\b[\s\S]{0,40}?\b([0-9]{7,12})\b/i
      );


    if (match) {

      orderId =
        match[1];

    }

  }



  /*
    4.
    DN বাদ দিয়ে standalone long number
  */

  if (!orderId) {


    const numbers =
      normalized.match(
        /\b[0-9]{7,12}\b/g
      );


    if (
      numbers &&
      numbers.length
    ) {


      const possible =
        numbers.find(function(num) {


          /*
            Phone বাদ
          */

          if (
            /^01[3-9][0-9]{8}$/.test(num)
          ) {

            return false;

          }


          /*
            8801... phone বাদ
          */

          if (
            /^8801[3-9][0-9]{8}$/.test(num)
          ) {

            return false;

          }


          return true;

        });


      if (possible) {

        orderId =
          possible;

      }

    }

  }



  /*
    QR-এর Order ID priority
  */

  if (orderId) {

    if (
      fromQR ||
      isEmpty("orderId")
    ) {

      setValue(
        "orderId",
        orderId
      );

    }

  }



  /* ===================================================
     DN / TRACKING ID
  =================================================== */

  let dn = "";


  /*
    DN20664
    DN 20664
    DN:20664
    DN-20664
  */

  match =
    normalized.match(
      /\bDN[\s:#-]*([A-Za-z0-9-]{4,20})\b/i
    );


  if (match) {

    dn =
      "DN" +
      match[1];

  }



  /*
    কিছু OCR-এ D N আলাদা হয়ে যেতে পারে
  */

  if (!dn) {

    match =
      normalized.match(
        /\bD\s*N\s*[:#-]?\s*([0-9A-Za-z-]{4,20})\b/i
      );


    if (match) {

      dn =
        "DN" +
        match[1];

    }

  }


  if (dn) {

    if (
      fromQR ||
      isEmpty("dn")
    ) {

      setValue(
        "dn",
        dn
      );

    }

  }



  /* ===================================================
     PHONE
  =================================================== */

  const phoneMatches =
    normalized.match(
      /(?:\+?88[\s-]?)?01[3-9][\s-]?[0-9]{3}[\s-]?[0-9]{5}/g
    );


  if (
    phoneMatches &&
    phoneMatches.length
  ) {


    for (
      let i = 0;
      i < phoneMatches.length;
      i++
    ) {


      const phone =
        cleanPhone(
          phoneMatches[i]
        );


      if (
        /^01[3-9][0-9]{8}$/.test(phone)
      ) {


        if (
          fromQR ||
          isEmpty("phone")
        ) {

          setValue(
            "phone",
            phone
          );

        }


        break;

      }

    }

  }



  /* ===================================================
     COD / PRICE
  =================================================== */

  let cod = "";


  /*
    CASH ON DELIVERY
    এর পরে amount

    যেমন:

    CASH ON DELIVERY
    ৳950
  */

  match =
    normalized.match(

      /CASH\s*ON\s*DELIVERY[\s\S]{0,100}?(?:৳|Tk|BDT)?\s*([0-9][0-9,]*(?:\.[0-9]+)?)/i

    );


  if (match) {

    cod =
      cleanNumber(
        match[1]
      );

  }



  /*
    COD: 950
  */

  if (!cod) {

    match =
      normalized.match(

        /\bCOD\s*[:#\-]?\s*(?:৳|Tk|BDT)?\s*([0-9][0-9,]*(?:\.[0-9]+)?)/i

      );


    if (match) {

      cod =
        cleanNumber(
          match[1]
        );

    }

  }



  /*
    TOTAL / AMOUNT / PRICE / COLLECT
  */

  if (!cod) {

    match =
      normalized.match(

        /\b(?:TOTAL|AMOUNT|PRICE|COLLECT)\s*[:#\-]?\s*(?:৳|Tk|BDT)?\s*([0-9][0-9,]*(?:\.[0-9]+)?)/i

      );


    if (match) {

      cod =
        cleanNumber(
          match[1]
        );

    }

  }



  /*
    ৳950
    Tk 950
    BDT 950
  */

  if (!cod) {

    match =
      normalized.match(

        /(?:৳|Tk|BDT)\s*([0-9][0-9,]*(?:\.[0-9]+)?)/i

      );


    if (match) {

      cod =
        cleanNumber(
          match[1]
        );

    }

  }



  /*
    OCR ৳ চিহ্নকে অন্য character হিসেবে পড়লে
    CASH ON DELIVERY-এর আশেপাশের number খুঁজবে
  */

  if (!cod) {


    const codArea =
      normalized.match(

        /CASH\s*ON\s*DELIVERY[\s\S]{0,150}/i

      );


    if (codArea) {


      const areaNumbers =
        codArea[0].match(
          /\b[0-9]{2,7}\b/g
        );


      if (
        areaNumbers &&
        areaNumbers.length
      ) {


        /*
          সবচেয়ে ছোট reasonable amount
          যেমন 950
        */

        const validAmounts =
          areaNumbers.filter(
            function(num) {

              const n =
                Number(num);

              return (
                n >= 10 &&
                n <= 1000000
              );

            }
          );


        if (
          validAmounts.length
        ) {

          cod =
            validAmounts[
              validAmounts.length - 1
            ];

        }

      }

    }

  }


  if (cod) {

    if (
      fromQR ||
      isEmpty("cod")
    ) {

      setValue(
        "cod",
        cod
      );

    }

  }



  /* ===================================================
     QTY + PRODUCT
  =================================================== */

  /*
    2 x Product Name
    2x Product Name
    2 × Product Name
  */

  match =
    normalized.match(
      /\b([0-9]{1,3})\s*[xX×]\s*([^\n\r]+)/i
    );


  if (match) {


    if (
      fromQR ||
      isEmpty("qty")
    ) {

      setValue(
        "qty",
        match[1]
      );

    }


    if (
      fromQR ||
      isEmpty("product")
    ) {

      setValue(
        "product",
        match[2].trim()
      );

    }

  }



  /*
    Qty: 2
  */

  if (
    isEmpty("qty")
  ) {


    match =
      normalized.match(
        /\bQty\s*[:#\-]?\s*([0-9]{1,3})\b/i
      );


    if (match) {

      setValue(
        "qty",
        match[1]
      );

    }

  }



  /*
    Quantity: 2
  */

  if (
    isEmpty("qty")
  ) {


    match =
      normalized.match(
        /\bQuantity\s*[:#\-]?\s*([0-9]{1,3})\b/i
      );


    if (match) {

      setValue(
        "qty",
        match[1]
      );

    }

  }



  /* ===================================================
     PRODUCT
  =================================================== */

  if (
    isEmpty("product")
  ) {


    match =
      normalized.match(

        /\bProduct\s*(?:Name)?\s*[:#\-]\s*([^\n\r]+)/i

      );


    if (match) {

      setValue(
        "product",
        match[1].trim()
      );

    }

  }



  /* ===================================================
     STATUS
  =================================================== */

  document.getElementById(
    "status"
  ).innerText =
    fromQR
      ? "✅ QR data পাওয়া গেছে — OCR চলছে..."
      : "✅ Scan complete — তথ্যগুলো দেখে SAVE PARCEL চাপুন";

}



/* =====================================================
   SAVE
===================================================== */

function showSavedMessage() {


  document.getElementById(
    "status"
  ).innerText =
    "✅ তথ্য প্রস্তুত আছে";


}



/* =====================================================
   PAGE LOAD
===================================================== */

window.addEventListener(
  "load",
  function() {

    console.log(
      "NextShopBD Courier Scanner Ready"
    );

  }
);


</script>


</body>

</html>
